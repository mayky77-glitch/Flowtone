name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --find swift-format
      - name: Lint Swift format
        run: swift format lint --strict --recursive Package.swift Sources Tests
      - name: Run tests
        run: swift test
      - name: Build release executable
        run: swift build -c release --product Flowtone
      - name: Package unsigned app
        shell: bash
        run: |
          scripts/package-shareable-release.sh dist
      - name: Upload unsigned macOS app artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: flowtone-unsigned-macos-app-${{ github.sha }}
          path: |
            dist/Flowtone-1.0.1-macos-arm64-unsigned.zip
            dist/Flowtone-1.0.1-macos-arm64-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 14
