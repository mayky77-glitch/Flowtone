name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --find swift-format
      - name: Lint Swift format
        run: swift format lint --strict --recursive Package.swift Sources Tests
      - name: Run tests
        run: swift test
      - name: Build release executable
        run: swift build -c release --product Flowtone
      - name: Package ad-hoc signed app
        shell: bash
        run: |
          scripts/package-shareable-release.sh dist
      - name: Upload ad-hoc signed macOS app artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: flowtone-adhoc-macos-app-${{ github.sha }}
          path: |
            dist/Flowtone-1.2.5-macos-arm64-adhoc.zip
            dist/Flowtone-1.2.5-macos-arm64-adhoc.zip.sha256
          if-no-files-found: error
          retention-days: 14

  verify-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Run Windows tests
        run: npm test
      - name: Build Windows installer
        run: npm run dist:win
      - name: Native Windows Electron smoke
        shell: pwsh
        env:
          CI: "true"
          FLOWTONE_USER_DATA: ${{ runner.temp }}\Flowtone-Учкук-QA
          FLOWTONE_QA_OUTPUT: ${{ github.workspace }}\windows\qa-artifacts\windows-smoke.json
          FLOWTONE_QA_SCREENSHOT: ${{ github.workspace }}\windows\qa-artifacts\windows-smoke.png
        run: |
          $executable = (Resolve-Path "dist\win-unpacked\Flowtone.exe").Path
          $process = Start-Process -FilePath $executable -ArgumentList "--flowtone-ci-smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:FLOWTONE_QA_OUTPUT) { Get-Content $env:FLOWTONE_QA_OUTPUT }
            throw "Native Windows Electron smoke failed with exit code $($process.ExitCode)"
          }
          $result = Get-Content $env:FLOWTONE_QA_OUTPUT -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw "Native Windows Electron smoke reported failure" }
          Get-Content $env:FLOWTONE_QA_OUTPUT
      - name: Upload Windows smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowtone-windows-smoke-${{ github.sha }}
          path: windows/qa-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Verify installer and checksum
        shell: pwsh
        run: |
          $installer = Get-Item "dist/Flowtone-Setup-Windows-x64.exe"
          if ($installer.Length -lt 50MB) { throw "Windows installer is unexpectedly small" }
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $installer.Name |
            Set-Content -NoNewline "dist/Flowtone-Setup-Windows-x64.exe.sha256"
      - name: Upload Windows installer artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: flowtone-windows-installer-${{ github.sha }}
          path: |
            windows/dist/Flowtone-Setup-Windows-x64.exe
            windows/dist/Flowtone-Setup-Windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14
