name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test and build macOS app
        run: |
          swift format lint --strict --recursive Package.swift Sources Tests
          swift test
          swift build -c release --product Flowtone
          scripts/package-shareable-release.sh dist
          cp dist/Flowtone-1.2.5-macos-arm64-adhoc.zip dist/Flowtone-macOS-arm64.zip
          (cd dist && shasum -a 256 Flowtone-macOS-arm64.zip > Flowtone-macOS-arm64.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/Flowtone-macOS-arm64.zip
            dist/Flowtone-macOS-arm64.zip.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Test and build Windows installer
        run: |
          npm ci
          npm run check
          npm test
          npm run dist:win
      - name: Native Windows Electron smoke
        shell: pwsh
        env:
          CI: "true"
          FLOWTONE_USER_DATA: ${{ runner.temp }}\Flowtone-Учкук-QA
          FLOWTONE_QA_OUTPUT: ${{ github.workspace }}\windows\qa-artifacts\windows-smoke.json
          FLOWTONE_QA_SCREENSHOT: ${{ github.workspace }}\windows\qa-artifacts\windows-smoke.png
        run: |
          $executable = (Resolve-Path "dist\win-unpacked\Flowtone.exe").Path
          $process = Start-Process -FilePath $executable -ArgumentList "--flowtone-ci-smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:FLOWTONE_QA_OUTPUT) { Get-Content $env:FLOWTONE_QA_OUTPUT }
            throw "Native Windows Electron smoke failed with exit code $($process.ExitCode)"
          }
          $result = Get-Content $env:FLOWTONE_QA_OUTPUT -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw "Native Windows Electron smoke reported failure" }
          Get-Content $env:FLOWTONE_QA_OUTPUT
      - name: Upload Windows smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowtone-release-windows-smoke-${{ github.sha }}
          path: windows/qa-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-Item "dist/Flowtone-Setup-Windows-x64.exe"
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $installer.Name |
            Set-Content -NoNewline "dist/Flowtone-Setup-Windows-x64.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            windows/dist/Flowtone-Setup-Windows-x64.exe
            windows/dist/Flowtone-Setup-Windows-x64.exe.sha256
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "Flowtone ${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" release/* --clobber
